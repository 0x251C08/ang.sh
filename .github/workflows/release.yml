name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
            configure: -DCMAKE_EXE_LINKER_FLAGS=-static
            strip: "true"
          - os: ubuntu-24.04-arm
            target: aarch64-linux
            configure: -DCMAKE_EXE_LINKER_FLAGS=-static
            strip: "true"
          - os: macos-latest
            target: arm64-darwin
            configure: ""
            strip: ""      # stripping breaks the ad-hoc code signature on arm64 macOS
          - os: macos-latest
            target: x86_64-darwin
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64
            strip: ""
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DANG_VERSION="${GITHUB_REF_NAME#v}" \
            ${{ matrix.configure }}
          cmake --build build --parallel

      - name: Smoke test
        run: |
          ./build/angsh --version
          test "$(./build/angsh --no-config -c 'echo hello | tr a-z A-Z')" = "HELLO"

      - name: Package (binary + checksum)
        run: |
          name="angsh-${GITHUB_REF_NAME}-${{ matrix.target }}"
          cp build/angsh "$name"
          if [ "${{ matrix.strip }}" = "true" ]; then strip "$name"; fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          ls -l "$name" "$name.sha256"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "angsh $tag" --generate-notes
          gh release upload "$tag" "angsh-${tag}-"* --clobber
