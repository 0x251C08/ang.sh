name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and upload assets for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Tag pushes use the pushed tag; manual runs use the input.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
            configure: -DCMAKE_EXE_LINKER_FLAGS=-static
            strip: "true"
          - os: ubuntu-24.04-arm
            target: aarch64-linux
            configure: -DCMAKE_EXE_LINKER_FLAGS=-static
            strip: "true"
          - os: macos-latest
            target: arm64-darwin
            configure: ""
            strip: ""      # stripping breaks the ad-hoc code signature on arm64 macOS
          - os: macos-latest
            target: x86_64-darwin
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64
            strip: ""
    steps:
      - uses: actions/checkout@v7
        with:
          # Build the code as of the target tag, not the branch used to dispatch.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DANG_VERSION="${TAG#v}" \
            ${{ matrix.configure }}
          cmake --build build --parallel

      - name: Smoke test
        run: |
          ./build/angsh --version
          test "$(./build/angsh --no-config -c 'echo hello | tr a-z A-Z')" = "HELLO"

      - name: Package (binary + checksum)
        run: |
          name="angsh-${TAG}-${{ matrix.target }}"
          cp build/angsh "$name"
          if [ "${{ matrix.strip }}" = "true" ]; then strip "$name"; fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          ls -l "$name" "$name.sha256"

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$TAG"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "angsh $tag" --generate-notes
          gh release upload "$tag" "angsh-${tag}-"* --clobber
