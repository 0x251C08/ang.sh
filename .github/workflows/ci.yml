name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
            configure: -DCMAKE_EXE_LINKER_FLAGS=-static
          - os: ubuntu-24.04-arm
            target: aarch64-linux
            configure: -DCMAKE_EXE_LINKER_FLAGS=-static
          - os: macos-latest
            target: arm64-darwin
            configure: ""
          - os: macos-latest
            target: x86_64-darwin
            configure: -DCMAKE_OSX_ARCHITECTURES=x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test
        run: |
          ./build/angsh --version
          test "$(./build/angsh --no-config -c 'echo hello | tr a-z A-Z')" = "HELLO"
          test "$(./build/angsh --no-config --posix -c 'FOO=bar; echo $FOO')" = "bar"
          if ./build/angsh --no-config -c 'C=1' 2>/dev/null; then
            echo "ang mode should reject bare assignment" >&2; exit 1
          fi
          echo "all smoke tests passed"
