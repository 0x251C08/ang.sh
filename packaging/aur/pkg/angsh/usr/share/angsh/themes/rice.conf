# rice theme — 256-color gradient, no special fonts needed.
#
# Looks like:  ✦ user@host  ~/Code/ang.sh  ⎇ main  ❯     (in lime/teal/orange/pink)
prompt_left="{lime}✦ {user}{reset}{gray}@{reset}{teal}{host}{reset}  {bold}{orange}{cwd}{reset}{pink}{branch}{reset}  {arrow} "
prompt_right="{gray}{mode}{time} {ok}{reset}"
