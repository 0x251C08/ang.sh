# default theme — ships with angsh.
#
# Placeholders: {user} {host} {cwd} {base} {status} {char} {git} {mode}
#               {ok} {fail} {arrow} {branch} {time}
# Colors: {black} {red} {green} {yellow} {blue} {magenta} {cyan} {white}
#         {br_red} {br_green} {br_yellow} {br_blue} {br_magenta} {br_cyan} {br_white}
#         {orange} {purple} {pink} {gray} {teal} {lime}
#         {on_black} {on_red} {on_green} {on_yellow} {on_blue} {on_magenta} {on_cyan} {on_white}
# Styles: {dim} {bold} {reset}
#
# Looks like:  user@host ~/Code/ang.sh ⎇ main ❯
prompt_left="{gray}{user}@{host}{reset} {bold}{blue}{cwd}{reset}{purple}{branch}{reset} {arrow} "
prompt_right="{dim}{mode}{time}{reset}"
